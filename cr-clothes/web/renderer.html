<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texture Renderer</title>
    <style>
        html, body, #textureRoot {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        #textureRoot {
            position: relative;
            background: #1d4ed8;
        }

        .runtime-image-layer,
        .runtime-draw-layer,
        .runtime-text-layer {
            position: absolute;
            left: 50%;
            top: 50%;
            transform-origin: center;
        }

        .runtime-image-layer {
            display: none;
            width: 400px;
            height: 400px;
            object-fit: fill;
            pointer-events: none;
        }

        .runtime-draw-layer {
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            transform: none;
            pointer-events: none;
        }

        .runtime-text-layer {
            color: #ffffff;
            font: 900 190px Arial, sans-serif;
            line-height: 1;
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="textureRoot">
        <div id="textLayers"></div>
    </div>
    <script src="renderer.js?v=11"></script>
</body>
</html>
